# Render.com deployment blueprint for SkillSwap.
#
# One-time setup:
#   1. Push this repo to GitHub (done).
#   2. In Render Dashboard: New → Blueprint → pick Abduljim/skillswap.
#   3. Add the required environment variables when prompted.
#
# The Postgres database lives on Neon (DATABASE_URL already in use) — no
# managed Postgres is provisioned here.
services:
  - type: web
    name: skillswap-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false # set in dashboard (use your Neon pooled connection string)
      - key: JWT_SECRET
        generateValue: true # or set your own long random string
      - key: CLIENT_URL
        value: https://skillswap-client-upag.onrender.com
      - key: SERVER_URL
        value: https://skillswap-api-eqxm.onrender.com
      - key: EXTRA_CORS_ORIGINS
        value: https://skillswap-client-upag.onrender.com
      # Google Play verification (add when going to the Play Store):
      # - key: GOOGLE_SERVICE_ACCOUNT_JSON
      # - key: ANDROID_PACKAGE_NAME
      #   value: app.skillswap.mobile

  - type: web
    name: skillswap-client
    runtime: static
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      # The browser calls the API directly (cross-origin, with cookies +
      # Bearer fallback). Render static rewrites can't proxy external hosts.
      - key: VITE_API_URL
        value: https://skillswap-api-eqxm.onrender.com
