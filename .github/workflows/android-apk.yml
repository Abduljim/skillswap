name: Android APK

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install client dependencies + Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build
        env:
          # The deployed API the Android app talks to. Override on a release
          # build, or change the default once the server has a public URL.
          VITE_API_URL: ${{ vars.ANDROID_API_URL || '' }}

      - name: Generate Android project
        run: npx cap add android

      - name: Add native billing plugin
        run: |
          mkdir -p android/app/src/main/java/com/skillswap/billing
          cp native/PlayBillingBridge.java android/app/src/main/java/com/skillswap/billing/
          # The index.html references /android-billing.js; place the bridge in
          # the web build output so it is bundled into the APK's assets.
          cp native/billing-bridge.js dist/android-billing.js

      - name: Register plugin in MainActivity
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          echo "--- original MainActivity ---"; cat "$MAIN"
          sed -i 's/^import com.getcapacitor.BridgeActivity;/import com.getcapacitor.BridgeActivity;\nimport com.skillswap.billing.PlayBillingBridge;/' "$MAIN"
          sed -i 's/this.init(savedInstanceState, .*);/this.registerPlugin(PlayBillingBridge.class);\n        this.init(savedInstanceState, new ArrayList<Class<? extends Plugin>>());/' "$MAIN"
          sed -i 's/public void onCreate(Bundle savedInstanceState) {/public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(PlayBillingBridge.class);/' "$MAIN"
          echo "--- patched MainActivity ---"; cat "$MAIN"

      - name: Add billing dependency
        run: |
          GRADLE=android/app/build.gradle
          grep -q billing-ktx "$GRADLE" || \
            sed -i "s/^dependencies {/dependencies {\n    implementation 'com.android.billingclient:billing-ktx:7.1.1'/" "$GRADLE"
          grep -n "billing-ktx" "$GRADLE"

      - name: Resolve Kotlin stdlib duplicates
        # billing-ktx pulls kotlin-stdlib-jdk8 1.6.21 which clashes with the
        # 1.8 stdlib Capacitor uses. The jdk7/jdk8 artifacts are folded into
        # kotlin-stdlib since 1.8, so depend directly on the new one.
        run: |
          GRADLE=android/app/build.gradle
          grep -q 'kotlin-stdlib:1.8.22' "$GRADLE" || \
            sed -i "s/^dependencies {/dependencies {\n    implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') { }\n    constraints {\n        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') { because 'align kotlin versions' }\n        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') { because 'align kotlin versions' }\n    }/" "$GRADLE"
          grep -n "kotlin-stdlib" "$GRADLE"

      - name: Sync Capacitor (keep injected files)
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skillswap-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
