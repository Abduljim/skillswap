name: Android APK

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout (full, keep committed android files)
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Stash committed native plugin files
        run: |
          mkdir -p /tmp/ss-native
          cp -r android/app/src/main/java /tmp/ss-native/java
          cp android/www/billing-bridge.js /tmp/ss-native/billing-bridge.js

      - name: Install client dependencies + Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Restore our native billing plugin
        run: |
          # Overlay our committed plugin onto the generated project
          mkdir -p android/app/src/main/java/com/skillswap/billing
          cp /tmp/ss-native/java/com/skillswap/billing/PlayBillingBridge.java \
             android/app/src/main/java/com/skillswap/billing/
          # Bundle the billing bridge into web assets
          mkdir -p android/app/src/main/assets/public
          cp /tmp/ss-native/billing-bridge.js android/app/src/main/assets/public/

      - name: Register plugin in MainActivity
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java)
          echo "MainActivity: $MAIN"
          # Replace the default app name and register our plugin
          sed -i 's/com.getcapacitor.BridgeActivity;/com.getcapacitor.BridgeActivity;\nimport com.skillswap.billing.PlayBillingBridge;/' "$MAIN"
          sed -i 's/this.registerPlugin(/this.registerPlugin(PlayBillingBridge.class);\n    this.registerPlugin(/' "$MAIN" || \
          sed -i 's/registerPlugin(/registerPlugin(PlayBillingBridge.class);\n        registerPlugin(/' "$MAIN"
          cat "$MAIN"

      - name: Add billing dependency
        run: |
          GRADLE=android/app/build.gradle
          grep -q billing-ktx "$GRADLE" || \
            sed -i "s/^dependencies {/dependencies {\n    implementation 'com.android.billingclient:billing-ktx:7.1.1'/" "$GRADLE"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skillswap-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
